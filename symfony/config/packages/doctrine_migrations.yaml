doctrine_migrations:
    migrations_paths:
        'App\Infrastructure\Shared\Persistence\Doctrine\Migrations':
            '%kernel.project_dir%/src/Infrastructure/Shared/Persistence/Doctrine/Migrations'
    
    storage:
        table_storage:
            table_name: 'migrations'
            version_column_name: 'version'
            version_column_length: 1024
            executed_at_column_name: 'executed_at'
    